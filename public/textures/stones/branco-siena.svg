<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0ece0"/>
      <stop offset="0.35" stop-color="#e8e2d4"/>
      <stop offset="0.68" stop-color="#f4f0e6"/>
      <stop offset="1" stop-color="#ede7d9"/>
    </linearGradient>
    <radialGradient id="warm1" cx="0.72" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#d4b880" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#e8d4a8" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#f8f4ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm2" cx="0.24" cy="0.78" r="0.55">
      <stop offset="0" stop-color="#c8b090" stop-opacity="0.22"/>
      <stop offset="0.65" stop-color="#e0ceae" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#f0ece2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.55" cy="0.45" r="0.70">
      <stop offset="0" stop-color="#d8d4cc" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#f0ece2" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4.0"/>
    </filter>
    <filter id="mid" x="-8%" y="-8%" width="116%" height="116%">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1024" height="1024" fill="url(#base)"/>
  <rect width="1024" height="1024" fill="url(#warm1)"/>
  <rect width="1024" height="1024" fill="url(#warm2)"/>
  <rect width="1024" height="1024" fill="url(#cool)"/>

  <!-- Broad soft tonal bands — typical Siena character -->
  <path d="M-80 160 C220 120 420 210 680 162 S920 108 1120 88" fill="none" stroke="#d4c8a8" stroke-width="60" opacity="0.28" filter="url(#soft)"/>
  <path d="M-80 380 C180 320 380 430 660 370 S900 310 1120 280" fill="none" stroke="#c8b88c" stroke-width="80" opacity="0.22" filter="url(#soft)"/>
  <path d="M-80 640 C200 560 420 680 700 610 S940 560 1120 530" fill="none" stroke="#ddd0b0" stroke-width="65" opacity="0.24" filter="url(#soft)"/>
  <path d="M-80 880 C240 790 460 880 740 820 S960 770 1120 750" fill="none" stroke="#ccc0a0" stroke-width="55" opacity="0.20" filter="url(#soft)"/>

  <!-- Primary golden/ochre veins — thick diagonal -->
  <path d="M-80 72 C180 140 340 92 560 160 S820 240 1120 180" fill="none" stroke="#b89a62" stroke-width="14" opacity="0.36" filter="url(#mid)"/>
  <path d="M-80 248 C160 330 380 268 620 340 S880 420 1120 360" fill="none" stroke="#c4a870" stroke-width="9" opacity="0.30"/>
  <path d="M-80 490 C200 560 440 500 680 580 S900 648 1120 590" fill="none" stroke="#a88c58" stroke-width="18" opacity="0.38" filter="url(#mid)"/>
  <path d="M-80 710 C220 780 480 720 740 800 S960 860 1120 810" fill="none" stroke="#b8a06a" stroke-width="11" opacity="0.32"/>
  <path d="M-80 950 C200 1010 420 960 660 1020 S900 1060 1120 1020" fill="none" stroke="#c2aa72" stroke-width="7" opacity="0.28"/>

  <!-- Secondary gray veins -->
  <path d="M-80 120 C140 180 310 136 520 200 S780 272 1100 220" fill="none" stroke="#9a9486" stroke-width="5" opacity="0.24"/>
  <path d="M-80 350 C180 400 360 358 600 418 S840 480 1120 440" fill="none" stroke="#8e8878" stroke-width="8" opacity="0.20"/>
  <path d="M-80 580 C200 620 400 580 640 638 S880 700 1120 660" fill="none" stroke="#a09890" stroke-width="6" opacity="0.22"/>
  <path d="M-80 820 C200 850 440 818 700 870 S940 930 1120 900" fill="none" stroke="#918b7e" stroke-width="4.5" opacity="0.20"/>

  <!-- Fine hairline veins — characteristic marble detail -->
  <path d="M-60 38 C100 58 220 44 360 66 S580 96 760 76 960 54 1120 44" fill="none" stroke="#c8b880" stroke-width="1.5" opacity="0.28"/>
  <path d="M-60 198 C120 218 280 204 480 228 S700 260 900 244 1060 230 1120 224" fill="none" stroke="#b0a478" stroke-width="2.2" opacity="0.24"/>
  <path d="M-60 456 C160 476 340 460 540 484 S780 516 980 500 1080 490 1120 486" fill="none" stroke="#c4b47e" stroke-width="1.8" opacity="0.26"/>
  <path d="M-60 660 C140 680 320 664 540 690 S780 722 980 708 1080 698 1120 694" fill="none" stroke="#a89870" stroke-width="2.5" opacity="0.22"/>
  <path d="M-60 900 C180 916 360 904 580 922 S820 948 1020 934" fill="none" stroke="#bca876" stroke-width="1.6" opacity="0.24"/>

  <!-- Very fine detail veins — micro branching -->
  <path d="M280 0 C300 120 318 240 350 380 S392 520 410 640 428 760 440 900" fill="none" stroke="#b09068" stroke-width="1.2" opacity="0.20"/>
  <path d="M540 0 C558 150 576 300 600 440 S632 580 648 700 660 840 668 1024" fill="none" stroke="#c0a870" stroke-width="1.0" opacity="0.18"/>
  <path d="M760 0 C780 140 798 280 820 420 S848 560 866 680 880 820 892 1024" fill="none" stroke="#a89062" stroke-width="1.4" opacity="0.22"/>

  <!-- White cloudy patches — calcite transparency effect -->
  <ellipse cx="320" cy="280" rx="180" ry="90" fill="#fffdf5" opacity="0.20" filter="url(#soft)" transform="rotate(-18 320 280)"/>
  <ellipse cx="720" cy="640" rx="160" ry="80" fill="#fffdf5" opacity="0.18" filter="url(#soft)" transform="rotate(22 720 640)"/>
  <ellipse cx="500" cy="880" rx="140" ry="70" fill="#fffdf5" opacity="0.16" filter="url(#soft)" transform="rotate(-8 500 880)"/>

  <!-- Grain texture dots -->
  <g fill="#a89870" opacity="0.16">
    <circle cx="88" cy="188" r="2.8"/>
    <circle cx="228" cy="420" r="2.2"/>
    <circle cx="376" cy="132" r="3.0"/>
    <circle cx="508" cy="568" r="2.4"/>
    <circle cx="644" cy="348" r="2.6"/>
    <circle cx="772" cy="788" r="2.2"/>
    <circle cx="884" cy="196" r="2.8"/>
    <circle cx="952" cy="644" r="2.0"/>
    <circle cx="144" cy="792" r="2.4"/>
    <circle cx="296" cy="952" r="2.6"/>
  </g>
</svg>

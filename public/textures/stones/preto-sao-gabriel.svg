    <ellipse cx="200" cy="700" rx="8" ry="3" fill="#3e4246" transform="rotate(-52 200 700)"/>
    <ellipse cx="460" cy="880" rx="10" ry="3.5" fill="#444850" transform="rotate(15 460 880)"/>
    <ellipse cx="680" cy="960" rx="7" ry="2.5" fill="#383c40" transform="rotate(-40 680 960)"/>
  </g>

  <!-- Quartz sparkle points -->
  <g fill="#e8eced" opacity="0.52">
    <circle cx="68" cy="98" r="1.8"/>
    <circle cx="156" cy="342" r="2.2"/>
    <circle cx="284" cy="186" r="1.6"/>
    <circle cx="420" cy="562" r="2.0"/>
    <circle cx="548" cy="320" r="1.8"/>
    <circle cx="632" cy="72" r="2.4"/>
    <circle cx="748" cy="488" r="1.6"/>
    <circle cx="844" cy="268" r="2.0"/>
    <circle cx="936" cy="724" r="1.8"/>
    <circle cx="112" cy="680" r="2.2"/>
    <circle cx="246" cy="820" r="1.6"/>
    <circle cx="374" cy="952" r="2.0"/>
    <circle cx="510" cy="840" r="1.8"/>
    <circle cx="640" cy="748" r="2.2"/>
    <circle cx="812" cy="912" r="1.6"/>
    <circle cx="976" cy="148" r="2.0"/>
  </g>

  <!-- Bright mica sparkles -->
  <g fill="#f0f4f5" opacity="0.60">
    <circle cx="196" cy="128" r="1.2"/>
    <circle cx="432" cy="270" r="1.4"/>
    <circle cx="616" cy="440" r="1.1"/>
    <circle cx="768" cy="156" r="1.3"/>
    <circle cx="892" cy="510" r="1.2"/>
    <circle cx="324" cy="640" r="1.4"/>

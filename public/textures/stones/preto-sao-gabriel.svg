<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111315"/>
      <stop offset="0.38" stop-color="#1d1f21"/>
      <stop offset="0.72" stop-color="#161819"/>
      <stop offset="1" stop-color="#0e1011"/>
    </linearGradient>
    <radialGradient id="g1" cx="0.28" cy="0.22" r="0.52">
      <stop offset="0" stop-color="#383d40" stop-opacity="0.42"/>
      <stop offset="0.6" stop-color="#202326" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0e1011" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0.76" cy="0.68" r="0.48">
      <stop offset="0" stop-color="#2c3033" stop-opacity="0.36"/>
      <stop offset="0.7" stop-color="#181b1d" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0e1011" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0.52" cy="0.44" r="0.62">
      <stop offset="0" stop-color="#44484a" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0e1011" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="blur2" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Base field -->
  <rect width="1024" height="1024" fill="url(#base)"/>
  <rect width="1024" height="1024" fill="url(#g1)"/>
  <rect width="1024" height="1024" fill="url(#g2)"/>
  <rect width="1024" height="1024" fill="url(#g3)"/>

  <!-- Broad dark mineral banding -->
  <path d="M-60 180 C180 140 320 220 520 170 S780 120 1100 80" fill="none" stroke="#2a2d2f" stroke-width="48" opacity="0.55" filter="url(#blur1)"/>
  <path d="M-80 420 C140 360 310 470 560 400 S820 350 1100 320" fill="none" stroke="#1e2123" stroke-width="72" opacity="0.48" filter="url(#blur1)"/>
  <path d="M-40 680 C200 580 400 710 640 630 S880 580 1100 560" fill="none" stroke="#252829" stroke-width="55" opacity="0.52" filter="url(#blur1)"/>
  <path d="M-20 880 C220 780 420 860 660 800 S900 760 1100 740" fill="none" stroke="#1a1c1e" stroke-width="62" opacity="0.44" filter="url(#blur1)"/>

  <!-- Medium gray veins -->
  <path d="M-60 90 C160 76 280 128 512 96 S800 64 1100 48" fill="none" stroke="#5a6064" stroke-width="6" opacity="0.28"/>
  <path d="M-60 310 C200 260 380 340 620 290 S860 250 1100 240" fill="none" stroke="#4a4e52" stroke-width="10" opacity="0.32"/>
  <path d="M-60 530 C180 470 360 560 600 500 S840 460 1100 430" fill="none" stroke="#686e72" stroke-width="4" opacity="0.22"/>
  <path d="M-60 750 C220 680 400 768 650 710 S880 670 1100 650" fill="none" stroke="#525659" stroke-width="8" opacity="0.28"/>
  <path d="M-60 930 C240 860 440 920 700 870 S920 830 1100 820" fill="none" stroke="#3e4245" stroke-width="12" opacity="0.30"/>

  <!-- Fine hairline veins -->
  <path d="M-30 50 C120 38 240 72 400 58 S680 32 900 22" fill="none" stroke="#7a8084" stroke-width="1.5" opacity="0.20"/>
  <path d="M-30 200 C200 172 380 220 580 196 S800 168 1060 150" fill="none" stroke="#606468" stroke-width="2" opacity="0.18"/>
  <path d="M-30 470 C150 440 310 488 520 460 S760 432 1060 408" fill="none" stroke="#8a9094" stroke-width="1.5" opacity="0.16"/>
  <path d="M-30 620 C180 590 360 630 560 608 S780 580 1060 560" fill="none" stroke="#6e7478" stroke-width="1.2" opacity="0.20"/>
  <path d="M-30 840 C200 812 380 852 590 828 S820 800 1060 778" fill="none" stroke="#585e62" stroke-width="2.2" opacity="0.22"/>

  <!-- Feldspar / plagioclase crystals — white/gray -->
  <g filter="url(#blur2)">
    <ellipse cx="82" cy="144" rx="14" ry="6" fill="#c8ccce" opacity="0.38" transform="rotate(-28 82 144)"/>
    <ellipse cx="224" cy="312" rx="18" ry="7" fill="#b8bcbe" opacity="0.32" transform="rotate(42 224 312)"/>
    <ellipse cx="388" cy="96" rx="11" ry="5" fill="#d0d4d6" opacity="0.42" transform="rotate(-15 388 96)"/>
    <ellipse cx="512" cy="450" rx="16" ry="6" fill="#babec0" opacity="0.34" transform="rotate(62 512 450)"/>
    <ellipse cx="668" cy="228" rx="13" ry="5" fill="#c4c8ca" opacity="0.38" transform="rotate(-38 668 228)"/>
    <ellipse cx="780" cy="560" rx="20" ry="8" fill="#aeb2b4" opacity="0.30" transform="rotate(18 780 560)"/>
    <ellipse cx="900" cy="144" rx="12" ry="5" fill="#ccd0d2" opacity="0.40" transform="rotate(-52 900 144)"/>
    <ellipse cx="148" cy="520" rx="15" ry="6" fill="#b4b8ba" opacity="0.36" transform="rotate(34 148 520)"/>
    <ellipse cx="456" cy="720" rx="17" ry="7" fill="#c0c4c6" opacity="0.32" transform="rotate(-22 456 720)"/>
    <ellipse cx="720" cy="820" rx="14" ry="5" fill="#caccce" opacity="0.38" transform="rotate(45 720 820)"/>
    <ellipse cx="312" cy="868" rx="16" ry="6" fill="#b8bcbe" opacity="0.34" transform="rotate(-60 312 868)"/>
    <ellipse cx="880" cy="740" rx="11" ry="4" fill="#d2d6d8" opacity="0.40" transform="rotate(28 880 740)"/>
    <ellipse cx="56" cy="780" rx="13" ry="5" fill="#bec2c4" opacity="0.36" transform="rotate(-40 56 780)"/>
    <ellipse cx="960" cy="480" rx="15" ry="6" fill="#c6cacc" opacity="0.34" transform="rotate(55 960 480)"/>
  </g>

  <!-- Biotite flakes — dark with sheen -->
  <g opacity="0.45">
    <ellipse cx="170" cy="260" rx="8" ry="3" fill="#3a3e42" transform="rotate(20 170 260)"/>
    <ellipse cx="340" cy="480" rx="10" ry="3.5" fill="#2e3236" transform="rotate(-35 340 480)"/>
